:root{
  --bg:#0a0a0a;--s1:#101010;--s2:#161616;--s3:#1e1e1e;
  --line:#232323;--line2:#303030;--line3:#444;
  --tx:#ededed;--tx2:#a1a1a1;--tx3:#6a6a6a;--tx4:#454545;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14.5px/1.5 'Chakra Petch',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);background:var(--s1);border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--line3)}
textarea{resize:vertical;min-height:90px;line-height:1.5}
::placeholder{color:var(--tx4)}
::selection{background:#444}
.mono{font-family:var(--mono)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.muted{color:var(--tx3)}
.sp{flex:1}

#app{display:grid;grid-template-columns:216px 1fr;height:100vh}
#side{border-right:1px solid var(--line);padding:26px 12px 20px;display:flex;flex-direction:column;gap:30px;min-height:0}
.brand{font:500 12px var(--mono);letter-spacing:.32em;text-transform:uppercase;padding:0 12px;display:flex;align-items:center;gap:10px}
.brand i{width:7px;height:7px;background:var(--tx);display:inline-block}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;color:var(--tx2);text-decoration:none;transition:background .12s,color .12s}
nav a:hover{background:var(--s1);color:var(--tx)}
nav a.on{background:var(--s3);color:var(--tx)}
nav .k{font:11px var(--mono);color:var(--tx4)}
.mini{font:12px var(--mono);color:var(--tx)}
.mini.paused{color:var(--tx3)}
.side-foot{margin-top:auto;padding:0 12px;display:flex;flex-direction:column;gap:14px}
.goal{cursor:pointer;display:flex;flex-direction:column;gap:2px}
.quote{cursor:pointer;position:relative;padding:4px 0 2px 14px;border-left:2px solid var(--tx3);font:500 15px/1.5 'Chakra Petch',sans-serif;color:var(--tx3);letter-spacing:.005em;text-wrap:pretty}
.quote:hover{border-left-color:var(--tx)}
.quote b{font-weight:700;color:var(--tx)}
.mquote{display:none}
@media (max-width:700px){.mquote{display:block;margin:0 0 18px;font-size:14px}}
.goal .v{font:600 28px 'Chakra Petch',sans-serif;letter-spacing:-.02em}
.goal .v.long{font-size:18px;line-height:1.3;letter-spacing:-.005em;overflow-wrap:anywhere}
.goal input{font:500 15px 'Chakra Petch',sans-serif;padding:6px 8px;width:100%}
.sync{font-size:11.5px;color:var(--tx4);display:flex;align-items:center;gap:7px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--tx4);display:inline-block}
.sync.live i{background:var(--tx2)}

main{overflow-y:auto;padding:44px 52px 90px;min-width:0}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:24px;font-weight:700;letter-spacing:-.005em}
h2{font-size:13px;font-weight:500;color:var(--tx2)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.head .l{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center}
.row-end{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:6px}

.btn{padding:8px 16px;border-radius:999px;border:1px solid var(--line2);color:var(--tx);white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--line3);background:var(--s1)}
.btn.pri{background:var(--tx);color:#0a0a0a;border-color:var(--tx);font-weight:500}
.btn.pri:hover{background:#fff}
.btn.sm{padding:5px 12px;font-size:13px}
.btn.lg{padding:12px 34px;font-size:15px}
.ghost{color:var(--tx3);padding:4px 8px;border-radius:6px;font-size:13px}
.ghost:hover{color:var(--tx);background:var(--s2)}
.icon-btn{width:32px;height:32px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--tx2)}
.icon-btn:hover{color:var(--tx);border-color:var(--line3)}
.seg{display:flex;align-items:center;gap:8px}
.seg .lbl{min-width:120px;text-align:center;font-size:13px;color:var(--tx2)}

.card{border:1px solid var(--line);border-radius:14px;padding:20px 20px 16px;background:var(--s1)}
.card h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.empty{color:var(--tx4);font-size:13px;padding:6px 0}

/* focus */
.focus{display:flex;flex-direction:column;align-items:center;padding:40px 0 44px;gap:14px}
.clock{font:700 120px/1 'Chakra Petch',sans-serif;letter-spacing:-.02em;font-feature-settings:'tnum';font-variant-numeric:tabular-nums;color:var(--tx);transition:color .2s}
.clock.idle{color:var(--tx4)}
.clock.paused{color:var(--tx3)}
.clock-sub{font-size:13px;color:var(--tx3);height:20px}
.controls{display:flex;gap:10px;margin-top:18px}
.hint{font:11px var(--mono);color:var(--tx4);letter-spacing:.06em;margin-top:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.fgrid{grid-template-columns:1fr 1fr}}

.item{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.item:first-child{border-top:0}
.item .t{font:12px var(--mono);color:var(--tx3);min-width:42px;padding-top:1px}
.item.ev{cursor:pointer}
.item.ev:hover span:not(.t){text-decoration:underline;text-decoration-color:var(--tx4)}
.tag{font-size:11.5px;color:var(--tx3);margin-left:auto;white-space:nowrap;padding-left:8px}
.dayl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin:12px 0 2px}
.dayl:first-child{margin-top:0}

/* checkbox */
.chk{width:16px;height:16px;border:1.5px solid var(--line3);border-radius:4px;flex:none;cursor:pointer;margin-top:2px;position:relative;transition:all .12s}
.chk:hover{border-color:var(--tx2)}
.chk.on{background:var(--tx2);border-color:var(--tx2)}
.chk.on::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #0a0a0a;border-width:0 2px 2px 0;transform:rotate(45deg)}

/* lists */
.lists{display:grid;grid-template-columns:240px 1fr;gap:28px;min-height:70vh}
.folders{display:flex;flex-direction:column;gap:2px}
.folders .fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px}
.fold{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--tx2);gap:10px}
.fold:hover{background:var(--s1);color:var(--tx)}
.fold.on{background:var(--s3);color:var(--tx)}
.fold .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .cnt{font:11.5px var(--mono);color:var(--tx3)}
.listpane{border-left:1px solid var(--line);padding-left:32px;min-width:0}
.lh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lh h1{cursor:text}
.lh input{font-size:22px;font-weight:600;padding:2px 8px;max-width:480px}
.lsub{font-size:12.5px;color:var(--tx3);margin:4px 0 22px}
.add{margin-bottom:10px;background:transparent;border-style:dashed}
.add:focus{border-style:solid;background:var(--s1)}
.task{display:flex;align-items:flex-start;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
.task:hover .x,.task:hover .due:not(.has){opacity:1}
.ttext{flex:1;cursor:text;word-break:break-word;min-height:21px}
.task.is-done .ttext{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--tx4)}
.task input.inline{flex:1;padding:2px 8px;font-size:14px}
.task input.date{flex:none;width:150px;padding:2px 8px;font-size:12.5px}
.due{font:11.5px var(--mono);color:var(--tx3);cursor:pointer;opacity:0;padding:2px 6px;border-radius:5px;white-space:nowrap}
.due.has{opacity:1;border:1px solid var(--line2)}
.due.over{color:var(--tx);border-color:var(--tx3)}
.due:hover{color:var(--tx)}
.x{opacity:0;color:var(--tx3);cursor:pointer;padding:0 4px;font-size:16px;line-height:20px}
.x:hover{color:var(--tx)}
.done-toggle{margin-top:18px}

/* week */
.week{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:440px}
.wcol{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.wcol:first-child{border-left:0}
.wcol.today{background:var(--s1)}
.whead{padding:14px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
.wdate{font:600 26px 'Chakra Petch',sans-serif;letter-spacing:-.03em;color:var(--tx2)}
.wcol.today .wdate{color:var(--tx)}
.wcol.past .wdate{color:var(--tx4)}
.whrs{font:11px var(--mono);color:var(--tx3);padding:0 14px 10px;height:24px}
.witems{display:flex;flex-direction:column;gap:6px;padding:0 8px;flex:1}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:#0a0a0a;padding:9px 16px;border-radius:999px;font-size:13px;z-index:80;animation:fade .15s}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="gate" class="gate" style="display:none"></div>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dayKey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtDur=s=>{const t=Math.round((s||0)/60);const h=Math.floor(t/60),m=t%60;return h?(m?`${h}h ${m}m`:`${h}h`):`${m}m`};
const fmtH=s=>{const h=(s||0)/3600;if(h>0&&h<0.05)return '<0.1';return h>=10?h.toFixed(0):h.toFixed(1).replace(/\.0$/,'')};
const fmtClock=ms=>{const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60)};
const fmtTime=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dow=d=>DOW[(d.getDay()+6)%7];
const fmtDay=d=>`${dow(d)} ${d.getDate()} ${MON[d.getMonth()]}`;
const fmtShort=k=>{const d=fromKey(k);return `${d.getDate()} ${MON[d.getMonth()]}`};
const todayKey=()=>dayKey(new Date());
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- state ---------- */
const S={sessions:[],folders:[],tasks:[],events:[],plans:[],habits:[],quotes:[],solves:[],food:[],meals:[],workouts:[],weights:[],ingredients:[],recipes:[],weekplans:[],shops:[],expenses:[],groceries:[],settings:{},bodySettings:{},moneySettings:{}};
const COLS=['sessions','folders','tasks','events'];
let mode='starting';
const hasFS=typeof window.showSaveFilePicker==='function'&&typeof window.showOpenFilePicker==='function';
let showArch=false;
const isArch=fid=>{const f=S.folders.find(x=>x.id===fid);return !!(f&&f.archived)};
let planOff=new Date().getHours()>=18?1:0, bodyDay=null, view='focus', curFolder=null, showDone=false, weekOff=0, logWeek=0, logQuery='';
let editingTask=null, editingDue=null, editingFolder=null, editingGoal=false, rendering=false, selectNext=false;
try{curFolder=localStorage.getItem('lockin-folder')}catch(e){}
const LS='lockin-local-v1';
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const loadLocal=()=>{try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)Object.assign(S,j)}catch(e){}};

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function safe(p){try{return await p}catch(e){console.error(e);toast(e&&e.code==='quota_exceeded'?'Storage is full':'Couldn’t save, try again');}}

/* ---------- storage: two files (study + body) ---------- */
const STUDY_COLS=['sessions','folders','tasks','events','plans','habits','quotes','solves'];
const BODY_COLS=['food','meals','workouts','weights','ingredients','recipes','weekplans','shops'];
const mkFile=(name,idbKey,cols,sk,suggested)=>({name,idbKey,cols,sk,suggested,handle:null,pending:null,lastWrite:0,saving:false,dirty:false,ops:[],timer:null,state:''});
const FILES={study:mkFile('study','file',STUDY_COLS,'settings','lockin-work.json'),body:mkFile('body','bodyfile',BODY_COLS,'bodySettings','lockin-fitness.json'),money:mkFile('money','moneyfile',['expenses','groceries'],'moneySettings','lockin-money.json')};
const fileOf=col=>col==='expenses'?FILES.money:BODY_COLS.includes(col)?FILES.body:FILES.study;
let legacyBody=null; // body data found inside an older study file, moved out once the body file exists

/* every local change is applied now and also kept as an op, so it can be replayed on top of
   edits made to the file from outside (e.g. by Claude) instead of overwriting them */
function applyOp(D,o){
  if(o.t==='settings'){D[o.sk]={...(D[o.sk]||{}),...o.p};return}
  const a=D[o.col]=D[o.col]||[],i=a.findIndex(x=>x.id===o.id);
  if(o.t==='put'){const r={id:o.id,...o.data};if(i>=0)a[i]=r;else a.push(r)}
  else if(o.t==='patch'){if(i>=0)a[i]={...a[i],...o.p}}
  else if(o.t==='del'){if(i>=0)a.splice(i,1)}
}
function op(o,F){applyOp(S,o);if(F.handle){F.ops.push(o);if(ghMode)ghSaveOps(F)}saveLocal();scheduleSave(F);render()}
const store={
  put(col,id,data){op({t:'put',col,id,data},fileOf(col))},
  patch(col,id,p){op({t:'patch',col,id,p},fileOf(col))},
  del(col,id){op({t:'del',col,id},fileOf(col))},
  settings(p){op({t:'settings',sk:'settings',p},FILES.study)},
  bodySettings(p){op({t:'settings',sk:'bodySettings',p},FILES.body)},
  moneySettings(p){op({t:'settings',sk:'moneySettings',p},FILES.money)}
};

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('lockin',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function kvSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}

function serialize(F){
  const o={app:'lock-in',kind:F.name,version:1,savedAt:new Date().toISOString()};
  Object.assign(o,F.extra||{});
  F.cols.forEach(k=>o[k]=S[k]);o.settings=S[F.sk]||{};
  if(F.name==='study'&&legacyBody){BODY_COLS.forEach(k=>{if(legacyBody[k])o[k]=legacyBody[k]});if(legacyBody.targets)o.settings={...o.settings,targets:legacyBody.targets}}
  return JSON.stringify(o,null,2);
}
function applyData(F,j){
  /* keep anything this version doesn't know about, so older/newer app versions never drop each other's data */
  F.extra={};Object.keys(j||{}).forEach(k=>{if(!F.cols.includes(k)&&!['app','kind','version','savedAt','settings'].includes(k)&&!(F.name==='study'&&BODY_COLS.includes(k)))F.extra[k]=j[k]});
  F.cols.forEach(k=>S[k]=Array.isArray(j[k])?j[k]:[]);
  const st=j.settings&&typeof j.settings==='object'?{...j.settings}:{};
  if(F.name==='study'){
    const lb={};let any=false;
    BODY_COLS.forEach(k=>{if(Array.isArray(j[k])&&j[k].length){lb[k]=j[k];any=true}});
    if(st.targets){lb.targets=st.targets;delete st.targets;any=true}
    legacyBody=any&&!FILES.body.handle?lb:(FILES.body.handle?null:legacyBody);
    if(any&&FILES.body.handle){FILES.study.dirty=true;scheduleSave(FILES.study)}
  }
  S[F.sk]=st;
}
function seed(F){
  const t=Date.now();
  if(F.name==='study'){
    S.folders=['Exams','Projects','Misc'].map((n,i)=>({id:'f'+(i+1),name:n,createdAt:t+i}));
    S.tasks=[];
    S.sessions=[];S.events=[];
    S.settings={gpaGoal:'',timer:{running:false,acc:0,startedAt:null,firstStart:null}};
  }else if(F.name==='money'){
    S.expenses=[];S.groceries=[];S.moneySettings={currency:'$',budget:0,categories:DEFAULT_CATS.slice()};
  }else{
    const lb=legacyBody||{};
    BODY_COLS.forEach(k=>S[k]=lb[k]||[]);
    S.bodySettings={targets:lb.targets||{protein:120,kcal:2000}};
  }
}
function setSave(F,s){F.state=s;document.querySelectorAll(`[data-save="${F.name}"]`).forEach(el=>el.textContent=s)}
function scheduleSave(F){if(!F.handle)return;F.dirty=true;setSave(F,'Saving…');clearTimeout(F.timer);F.timer=setTimeout(()=>flush(F),ghMode?1500:250)}
async function flush(F){
  if(F.saving){clearTimeout(F.timer);F.timer=setTimeout(()=>flush(F),150);return}
  if(!F.dirty||!F.handle)return;
  F.saving=true;F.dirty=false;
  try{
    const cur=await F.handle.getFile();
    if(cur.lastModified!==F.lastWrite){
      /* file changed outside the app since we last read/wrote it: merge */
      try{const j=JSON.parse(await cur.text());const ops=F.ops.slice();applyData(F,j);ops.forEach(o=>applyOp(S,o));render()}catch(e){}
    }
    const sent=F.ops.length;
    const w=await F.handle.createWritable();await w.write(serialize(F));await w.close();
    const f=await F.handle.getFile();F.lastWrite=f.lastModified;F.ops.splice(0,sent);if(ghMode){ghSaveOps(F);GH.lastSync=Date.now()}setSave(F,'Saved');
  }catch(e){if(e&&e.retry){F.dirty=true;F.saving=false;scheduleSave(F);return}
    if(ghMode){console.warn(e);F.dirty=true;setSave(F,navigator.onLine?'Not synced yet':'Offline · saved on this device');F.saving=false;if(e&&e.auth)ghAuthProblem();return}
    console.error(e);F.dirty=true;setSave(F,'Not saved');toast(`Couldn\u2019t save to ${F.handle.name}. ${F.name==='study'?'Click the file name (bottom left)':'Refresh the app'} to reconnect.`)}
  F.saving=false;
}
async function openHandle(F,h){
  const f=await h.getFile(),txt=(await f.text()).trim();
  if(txt){
    let j;try{j=JSON.parse(txt)}catch(e){toast('That file isn\u2019t a Lock In data file');return false}
    if(j.kind&&j.kind!==F.name){toast(`That\u2019s your ${j.kind==='study'?'work':j.kind==='body'?'fitness':'money'} file, not the ${F.name==='study'?'work':F.name==='body'?'fitness':'money'} one.`);return false}
    const other=F.name==='study'?'body':'study';
    if(j.kind===other){toast(F.name==='study'?'That\u2019s your fitness file. Pick your work file.':'That\u2019s your work file. Pick or create a separate fitness file.');return false}
    if(j.app!=='lock-in'&&!(j[F.cols[0]]||j[F.cols[1]])){toast('That file isn\u2019t a Lock In data file');return false}
    applyData(F,j);
  }else seed(F);
  F.handle=h;F.pending=null;F.lastWrite=f.lastModified;F.ops=[];
  if(!h.isServer)await kvSet(F.idbKey,h);
  if(F.name==='study'){mode='file';hideGate()}
  if(!txt){F.dirty=true;await flush(F)}else setSave(F,'Saved');
  if(F.name==='body'&&legacyBody){legacyBody=null;FILES.study.dirty=true;scheduleSave(FILES.study);if(!txt)toast('Moved your food, training and weigh-ins into the fitness file')}
  saveLocal();render();return true;
}
const pickOpts=F=>({types:[{description:'Lock In data',accept:{'application/json':['.json']}}],startIn:FILES.study.handle||FILES.body.handle||FILES.body.pending||'documents'});
async function createFile(F){
  try{const h=await window.showSaveFilePicker({...pickOpts(F),suggestedName:F.suggested});await openHandle(F,h)}catch(e){if(e.name!=='AbortError'){console.error(e);toast('Couldn\u2019t create the file')}}
}
async function openFile(F){
  try{const [h]=await window.showOpenFilePicker({...pickOpts(F),multiple:false});await openHandle(F,h)}catch(e){if(e.name!=='AbortError'){console.error(e);toast('Couldn\u2019t open the file')}}
}
async function reconnect(F,h){
  try{const p=await h.requestPermission({mode:'readwrite'});if(p==='granted'){await openHandle(F,h);return true}toast('Lock In needs permission to save to the file')}catch(e){console.error(e);if(F.name==='study')showGate('new')}
  return false;
}
async function reconnectBoth(h){
  /* ask for the body file in the same click too, so it's usually one click */
  const bp=FILES.body.pending;
  const pb=bp?bp.requestPermission({mode:'readwrite'}).catch(()=>null):null;
  const ok=await reconnect(FILES.study,h);
  if(ok&&pb){const r=await pb;if(r==='granted')await openHandle(FILES.body,bp)}
  const mp=FILES.money.pending;if(ok&&mp){try{if(await mp.requestPermission({mode:'readwrite'})==='granted')await openHandle(FILES.money,mp)}catch(e){}}
}
function hideGate(){const g=$('#gate');g.style.display='none';g.innerHTML=''}
function showGate(kind,h){
  const g=$('#gate');g.style.display='flex';
  if(kind==='reconnect'){
    g.innerHTML=`<div class="gate-in"><div class="brand" style="padding:0"><i></i>Lock in</div><h1>Welcome back.</h1>
      <p>Click below to open your data. Your browser asks for this once each time you open the app.</p>
      <div class="row"><button class="btn pri lg" id="g-re">Open my data</button></div>
      <div class="row"><button class="ghost" id="g-other">Use a different work file</button></div></div>`;
    $('#g-re').onclick=()=>reconnectBoth(h);$('#g-other').onclick=()=>showGate('new');
  }else{
    g.innerHTML=`<div class="gate-in"><div class="brand" style="padding:0"><i></i>Lock in</div><h1>Where should your data live?</h1>
      <p>Your study and work data is saved to one file on your laptop. Keep it in the same folder as this app, <span class="mono" style="font-size:12.5px">D:\\LOCK IN</span>.</p>
      <div class="row"><button class="btn pri lg" id="g-new">Create a new data file</button><button class="btn lg" id="g-open">Open an existing one</button></div>
      ${FILES.study.handle?'<div class="row"><button class="ghost" id="g-back">Cancel</button></div>':''}
      <p class="small">Works offline. Nothing is uploaded anywhere.</p></div>`;
    $('#g-new').onclick=()=>createFile(FILES.study);$('#g-open').onclick=()=>openFile(FILES.study);
    const b=$('#g-back');if(b)b.onclick=hideGate;
  }
}
/* pick up changes made to either file from outside (e.g. by Claude) */
async function checkFile(F){
  if(!F.handle||F.saving||F.dirty)return;
  try{const f=await F.handle.getFile();if(f.lastModified!==F.lastWrite){const j=JSON.parse(await f.text());if(F.saving||F.dirty)return;F.lastWrite=f.lastModified;applyData(F,j);saveLocal();render();if(!cloudMode)toast(`Updated from ${F.handle.name}`)}}catch(e){}
}
const checkAll=()=>{checkFile(FILES.study);checkFile(FILES.body);checkFile(FILES.money)};
setInterval(checkAll,2000);
window.addEventListener('focus',checkAll);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkAll()});
window.addEventListener('beforeunload',e=>{const d=Object.values(FILES).filter(F=>F.dirty);if(d.length){d.forEach(flush);e.preventDefault();e.returnValue=''}});

const folderName=id=>(S.folders.find(f=>f.id===id)||{}).name||'';
const foldersSorted=()=>S.folders.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const dayTotals=()=>{const t={};S.sessions.forEach(s=>{t[s.day]=(t[s.day]||0)+(s.durSec||0)});return t};

/* ---------- timer ---------- */
const T=()=>S.settings.timer||{running:false,acc:0,startedAt:null,firstStart:null};
const elapsed=()=>{const t=T();return (t.acc||0)+(t.running&&t.startedAt?Date.now()-t.startedAt:0)};
function startTimer(){const t=T(),now=Date.now();store.settings({timer:{running:true,acc:t.acc||0,startedAt:now,firstStart:t.firstStart||now}});render()}
function pauseTimer(){const t=T();if(!t.running)return;store.settings({timer:{running:false,acc:elapsed(),startedAt:null,firstStart:t.firstStart}});render()}
function resetTimer(){store.settings({timer:{running:false,acc:0,startedAt:null,firstStart:null}});render()}
function finishTimer(){
  const ms=elapsed();if(ms<1000)return;
  const start=T().firstStart||Date.now()-ms;
  pauseTimer();
  sessionModal({mode:'timer',ms,start});
}
function toggleTimer(){const t=T();t.running?pauseTimer():startTimer()}
setInterval(()=>{
  const ms=elapsed(),t=T();
  document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=fmtClock(ms));
  document.querySelectorAll('[data-clock-mini]').forEach(e=>e.textContent=ms>0?fmtClock(ms):'');
},250);

/* ---------- modal ---------- */
function modal(html,mount,wide){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="dlg ${wide?(wide==='x'?'wide xwide':'wide'):''}">${html}</div>`;
  $('#modal-root').appendChild(ov);
  const close=()=>ov.remove();
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  mount&&mount(ov.firstElementChild,close);
  const f=ov.querySelector('[autofocus]');if(f)setTimeout(()=>f.focus(),10);
  return close;
}
const modalOpen=()=>$('#modal-root').children.length>0;
function confirmBox(msg,ok='Delete'){
  return new Promise(res=>{
    modal(`<div style="font-size:14.5px">${esc(msg)}</div><div class="row-end"><button class="btn" data-a="no">Cancel</button><button class="btn pri" data-a="yes" autofocus>${esc(ok)}</button></div>`,
    (el,close)=>{el.querySelector('[data-a=no]').onclick=()=>{close();res(false)};el.querySelector('[data-a=yes]').onclick=()=>{close();res(true)}});
  });
}

/* ---------- session modal ---------- */
function sessionModal(o){
  const s=o.session, isTimer=o.mode==='timer', isEdit=o.mode==='edit';
  const start=s?s.start:(o.start||Date.now()-3600e3);
  let mins=s?Math.round(s.durSec/60):isTimer?Math.max(1,Math.round(o.ms/60000)):60;
  const sd=new Date(start);
  const auto=isTimer?S.tasks.filter(t=>t.done&&!t.sessionId&&t.doneAt>=start):[];
  const open=S.tasks.filter(t=>!t.done&&!isArch(t.folderId));
  const groups={};
  open.forEach(t=>{(groups[t.folderId]=groups[t.folderId]||[]).push(t)});
  const pickHtml=isEdit?'':`
    <div><div class="eyebrow" style="margin-bottom:8px">Ticked off this session</div>
    <div class="pick">
      ${auto.length?`<div class="pf">Already ticked</div>${auto.map(t=>`<div class="pi"><div class="chk on" data-pick="${t.id}"></div><span>${esc(t.text)} <span class="muted">· ${esc(folderName(t.folderId))}</span></span></div>`).join('')}`:''}
      ${foldersSorted().filter(f=>groups[f.id]).map(f=>`<div class="pf">${esc(f.name)}</div>${groups[f.id].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).map(t=>`<div class="pi"><div class="chk" data-pick="${t.id}"></div><span>${esc(t.text)}</span></div>`).join('')}`).join('')}
      ${!auto.length&&!open.length?'<div class="empty">No open checklist items.</div>':''}
    </div></div>`;
  const doneHtml=isEdit&&(s.done||[]).length?`<div><div class="eyebrow" style="margin-bottom:8px">Ticked off</div><div class="chips">${s.done.map(d=>`<span class="chip">✓ ${esc(d.text)}${d.folder?`<em>${esc(d.folder)}</em>`:''}</span>`).join('')}</div></div>`:'';
  const head=isTimer?`<div class="eyebrow">Session done</div><div class="dur-big">${fmtClock(o.ms)}</div>`:`<div class="eyebrow">${isEdit?'Edit session':'Log a past session'}</div>`;
  modal(`${head}
    <label>What did you get done?<textarea id="s-note" autofocus placeholder="e.g. Finished ch. 6 notes, 15 practice Qs on integrals">${esc(s?s.note:'')}</textarea></label>
    ${pickHtml}${doneHtml}
    <div class="row">
      <label>Date<input type="date" id="s-date" value="${dayKey(sd)}"></label>
      <label>Start<input type="time" id="s-time" value="${pad(sd.getHours())}:${pad(sd.getMinutes())}"></label>
      <label>Hours<input type="number" id="s-h" min="0" max="23" value="${Math.floor(mins/60)}"></label>
      <label>Min<input type="number" id="s-m" min="0" max="59" value="${mins%60}"></label>
    </div>
    <div id="s-err"></div>
    <div class="row-end">
      ${isTimer?'<button class="ghost danger-t" data-a="discard">Discard</button><span class="sp"></span><button class="btn" data-a="resume">Keep going</button>':''}
      ${isEdit?'<button class="ghost danger-t" data-a="del">Delete</button><span class="sp"></span>':''}
      ${!isTimer?'<button class="btn" data-a="cancel">Cancel</button>':''}
      <button class="btn pri" data-a="save">Save</button>
    </div>`,(el,close)=>{
      el.querySelectorAll('[data-pick]').forEach(c=>c.parentElement.addEventListener('click',e=>{e.preventDefault();c.classList.toggle('on')}));
      const on=a=>el.querySelector(`[data-a=${a}]`);
      on('cancel')&&(on('cancel').onclick=close);
      on('resume')&&(on('resume').onclick=()=>{close();startTimer()});
      on('discard')&&(on('discard').onclick=async()=>{if(await confirmBox('Discard this session? The time won’t be logged.','Discard')){close();resetTimer()}});
      on('del')&&(on('del').onclick=async()=>{if(await confirmBox('Delete this session from your log?')){close();store.del('sessions',s.id)}});
      on('save').onclick=async()=>{
        const dv=$('#s-date',el).value,tv=$('#s-time',el).value||'00:00';
        const h=parseInt($('#s-h',el).value)||0,m=parseInt($('#s-m',el).value)||0;
        const durSec=(h*60+m)*60;
        if(!dv){$('#s-err',el).innerHTML='<div class="err">Pick a date.</div>';return}
        if(durSec<=0){$('#s-err',el).innerHTML='<div class="err">Duration needs to be more than 0.</div>';return}
        const [y,mo,d]=dv.split('-').map(Number),[hh,mi]=tv.split(':').map(Number);
        const st=new Date(y,mo-1,d,hh,mi).getTime(),end=st+durSec*1000;
        const note=$('#s-note',el).value.trim();
        if(isEdit){close();await store.patch('sessions',s.id,{start:st,end,durSec,day:dayKey(st),note});return}
        const picked=[...el.querySelectorAll('[data-pick].on')].map(c=>S.tasks.find(t=>t.id===c.dataset.pick)).filter(Boolean);
        const id=uid();
        close();
        await store.put('sessions',id,{start:st,end,durSec,day:dayKey(st),note,done:picked.map(t=>({id:t.id,text:t.text,folder:folderName(t.folderId)})),createdAt:Date.now()});
        for(const t of picked) await store.patch('tasks',t.id,{done:true,doneAt:t.done&&t.doneAt?t.doneAt:end,sessionId:id});

/* ---------- render ---------- */
let renderLater=false;
function render(){
  // While you're typing in the day plan, don't rebuild the page: replacing the textarea makes phone keyboards
  // drop out of number / caps mode. Update the sidebar and timeline only, and do the full render when you leave the box.
  const ae=document.activeElement;
  if(ae&&ae.dataset&&ae.dataset.plan&&document.getElementById('main').contains(ae)){
    renderLater=true;$('#side').innerHTML=renderSide();const w=$('#tl-wrap');if(w)w.innerHTML=timelineHtml(ae.dataset.plan);return}
  renderLater=false;
  rendering=true;
  const app=$('#app'),a=document.activeElement;let keep=null;
  if(a&&a.dataset&&a.dataset.k&&app.contains(a))keep={k:a.dataset.k,v:a.value,s:a.selectionStart,e:a.selectionEnd,t:a.scrollTop};
  const vals={};app.querySelectorAll('input[data-k][data-hold]').forEach(i=>{if(i.value)vals[i.dataset.k]=i.value});
  $('#side').innerHTML=renderSide();
  const _ms=elapsed(),_t=T();
  $('#main').innerHTML=`<div class="mhead"><span class="brand" style="padding:0"><i></i>Lock in</span>${_ms>0?`<a href="#focus" class="mini ${_t.running?'':'paused'}" data-clock-mini style="text-decoration:none"></a>`:''}<span class="msync" data-act="switch-file">${FILES.study.handle?`<i></i><span data-save="study">${FILES.study.state||'Saved'}</span>`:''}</span></div><div class="wrap">${(VIEWS[view]||VIEWS.focus)()}</div>`;
  Object.entries(vals).forEach(([k,v])=>{const n=app.querySelector(`[data-k="${k}"]`);if(n&&!n.value)n.value=v});
  if(keep){const n=app.querySelector(`[data-k="${keep.k}"]`);if(n){n.value=keep.v;n.focus();try{n.setSelectionRange(keep.s,keep.e)}catch(e){}n.scrollTop=keep.t||0}}
  else{const af=app.querySelector('[data-autofocus]');if(af){af.focus();try{if(selectNext){af.select();selectNext=false}else{const L=af.value.length;af.setSelectionRange(L,L)}}catch(e){}}}
  const ms=elapsed();document.querySelectorAll('[data-clock]').forEach(e=>e.textContent=fmtClock(ms));
  document.querySelectorAll('[data-clock-mini]').forEach(e=>e.textContent=ms>0?fmtClock(ms):'');
  if(view==='quotes')qFit();
  rendering=false;
}

/* ---------- cube times ---------- */

const CUBE_DEFAULT=[{id:'c333',name:'3x3'}];

function parseSolve(v){let s=String(v||'').trim().toLowerCase();if(!s)return null;if(s==='dnf')return {dnf:true,ms:0};
  s=s.replace(/s$/,'').replace(/,/g,'.');let ms=NaN;
  const m=/^(\d+):(\d{1,2}(?:\.\d+)?)$/.exec(s);if(m)ms=(+m[1]*60+parseFloat(m[2]))*1000;
  else if(/^\d+(\.\d+)?$/.test(s))ms=parseFloat(s)*1000;
  return isFinite(ms)&&ms>0?{ms:Math.round(ms)}:null}

function bestAo(list,n){let b=null;for(let i=n;i<=list.length;i++){const a=aoN(list.slice(0,i),n);if(a!=null&&(b==null||a<b))b=a}return b}
function cubePB(list){let b=null;list.forEach(x=>{const v=solveVal(x);if(isFinite(v)&&(!b||v<solveVal(b)))b=x});return b}
const fmtAt=t=>{const d=new Date(t);return `${d.getDate()} ${MON[d.getMonth()]} · ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function cubeSpark(list){const v=list.slice(-30).map(solveVal).filter(isFinite);if(v.length<2)return '';const mn=Math.min(...v),mx=Math.max(...v),W=300,H=44,r=mx-mn||1;
  const pts=v.map((y,i)=>`${(i/(v.length-1)*W).toFixed(1)},${(4+(y-mn)/r*(H-8)).toFixed(1)}`).join(' ');
  return `<svg class="spark2" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--tx3)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}

      ${L.length>5?`<div style="margin-top:8px"><span class="lnk muted" style="font-size:12.5px;cursor:pointer;text-decoration:underline" data-act="cube-more" data-id="${c.id}">${open?'Show less':`Show all ${L.length}`}</span></div>`:''}

/* ---------- quote board ---------- */
let qYear=null,qSel=null,qPhoneMode='list';
const QW=1000;

function qEstH(q){const s=q.size||28,w=(q.w||360)-24,cpl=Math.max(6,w/(s*.52)),lines=String(q.text||'').split('\n').reduce((n,l)=>n+Math.max(1,Math.ceil(l.length/cpl)),0);return lines*s*1.25+44}
function qFit(){const w=$('#qwrap'),c=$('#qcanvas');if(!w||!c)return;const sc=w.clientWidth/QW;c.style.transform=`scale(${sc})`;w.style.height=(+w.dataset.h*sc)+'px'}

function qFree(y,w,hh){const R=qOfYear(y).map(q=>{const b=document.querySelector(`.qbox[data-qid="${q.id}"]`);return {x:q.x||0,y:q.y||0,w:q.w||360,h:b?b.offsetHeight:qEstH(q)}});

// board interactions: drag to move, handle to resize, tools, click to open
(()=>{let g=null;
  const scale=()=>{const w=$('#qwrap');return w?w.clientWidth/QW:1};
  document.addEventListener('pointerdown',e=>{if(view!=='quotes')return;const box=e.target.closest&&e.target.closest('.qbox');
    if(!box){if(qSel&&e.target.closest&&e.target.closest('#qwrap')){qSel=null;document.querySelectorAll('.qbox.act').forEach(b=>b.classList.remove('act'))}return}
    const q=S.quotes.find(x=>x.id===box.dataset.qid);if(!q)return;const tool=e.target.closest('[data-qt]');
    if(tool&&tool.dataset.qt!=='rs')return;// tool buttons handled on click
    e.preventDefault();
    g={box,q,mode:tool?'rs':'mv',x0:e.clientX,y0:e.clientY,sx:q.x||0,sy:q.y||0,sw:q.w||360,on:false,pid:e.pointerId};
    try{box.setPointerCapture(e.pointerId)}catch(_){}
  });
  document.addEventListener('pointermove',e=>{if(!g||e.pointerId!==g.pid)return;const sc=scale(),dx=(e.clientX-g.x0)/sc,dy=(e.clientY-g.y0)/sc;
    if(!g.on){if(Math.hypot(e.clientX-g.x0,e.clientY-g.y0)<4)return;g.on=true;g.box.classList.add('dragging')}
    if(g.mode==='mv'){g.nx=Math.max(0,Math.min(QW-g.box.offsetWidth,g.sx+dx));g.ny=Math.max(0,g.sy+dy);g.box.style.left=g.nx+'px';g.box.style.top=g.ny+'px';
      const c=$('#qcanvas'),w=$('#qwrap'),need=g.ny+g.box.offsetHeight+160;if(c&&need>parseFloat(c.style.height)){c.style.height=need+'px';w.dataset.h=need;qFit()}}
    else{g.nw=Math.max(140,Math.min(QW-(g.q.x||0)-10,g.sw+dx));g.box.style.width=g.nw+'px'}});
  const up=e=>{if(!g||e.pointerId!==g.pid)return;const d=g;g=null;d.box.classList.remove('dragging');
    if(!d.on){if(e.type==='pointerup'&&d.mode==='mv'){const q=d.q;if(qSel===q.id){qOpen(q)}else{qSel=q.id;document.querySelectorAll('.qbox.act').forEach(b=>b.classList.remove('act'));d.box.classList.add('act');if(!window.matchMedia('(hover:none)').matches)qOpen(q)}}return}
    if(d.mode==='mv')store.patch('quotes',d.q.id,{x:Math.round(d.nx),y:Math.round(d.ny),z:Date.now()});else store.patch('quotes',d.q.id,{w:Math.round(d.nw)})};
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
  document.addEventListener('click',e=>{if(view!=='quotes')return;const t=e.target.closest&&e.target.closest('.qtools [data-qt]');if(!t)return;e.stopPropagation();
    const box=t.closest('.qbox'),q=S.quotes.find(x=>x.id===box.dataset.qid);if(!q)return;qSel=q.id;const k=t.dataset.qt;
    if(k==='up'||k==='dn'){const s=Math.max(12,Math.min(110,(q.size||28)+(k==='up'?(q.size>=40?4:2):-(q.size>40?4:2))));store.patch('quotes',q.id,{size:s})}
    else if(k==='tone')store.patch('quotes',q.id,{tone:((q.tone||1)%3)+1});
    else if(k==='open')qOpen(q)},true);
})();

/* week */
function renderWeek(){
  const ws=addDays(weekStart(new Date()),7*weekOff),we=addDays(ws,6),tk=todayKey(),tot=dayTotals();
  let hrs=0,evc=0,duec=0;
  const cols=[0,1,2,3,4,5,6].map(i=>{
    const d=addDays(ws,i),k=dayKey(d);
    const evs=S.events.filter(e=>e.date===k).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const dues=S.tasks.filter(t=>!t.done&&t.due===k&&!isArch(t.folderId));
    hrs+=tot[k]||0;evc+=evs.length;duec+=dues.length;
    return `<div class="wcol ${k===tk?'today':''} ${k<tk?'past':''}">
      <div class="whead"><span class="eyebrow">${DOW[i]}</span><span class="wdate">${d.getDate()}</span></div>
      <div class="whrs">${tot[k]?fmtDur(tot[k])+' logged':''}</div>
      <div class="witems">
        ${evs.map(e=>`<div class="wev" data-act="ev-edit" data-id="${e.id}">${e.time?`<span class="tm">${e.time}</span>`:''}${esc(e.title)}</div>`).join('')}
        ${dues.map(t=>`<div class="wdue" title="${esc(folderName(t.folderId))}">${esc(t.text)}</div>`).join('')}
      </div>
      <div class="wadd" data-act="ev-new" data-date="${k}">+ Add</div>
    </div>`;
  }).join('');
  const label=weekOff===0?'This week':weekOff===1?'Next week':weekOff===-1?'Last week':`${weekOff>0?'+':''}${weekOff} weeks`;

// calculator: "12.9+3.2", "=45.4-3", "3*2.50", "(10+5)/2". Never uses eval.
function calc(v){let s=String(v??'').trim().replace(/^=/,'').replace(/[$€£¥,\s]/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/');
  if(!s)return NaN;if(!/^[0-9.+\-*/()]+$/.test(s))return NaN;let i=0;
  const peek=()=>s[i],eat=c=>{if(s[i]===c){i++;return true}return false};
  const numb=()=>{const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const fac=()=>{if(eat('-'))return -fac();if(eat('+'))return fac();if(eat('(')){const v=add();if(!eat(')'))throw 0;return v}return numb()};
  const mul=()=>{let v=fac();for(;;){if(eat('*'))v*=fac();else if(eat('/')){const d=fac();if(!d)throw 0;v/=d}else return v}};
  const add=()=>{let v=mul();for(;;){if(eat('+'))v+=mul();else if(eat('-'))v-=mul();else return v}};
  try{const r=add();return i===s.length&&isFinite(r)?r:NaN}catch(e){return NaN}}
const isExpr=v=>/\d\s*[+\-*/x×÷]\s*[\d(]|^\s*=/.test(String(v||''));
const num=v=>{let n=calc(v);if(isNaN(n))n=isExpr(v)?0:parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
// live "= result" bubble for calculator fields, and swap the formula for its result when you leave the field
(()=>{let tip=null;const show=el=>{const v=el.value;if(!isExpr(v)||isNaN(calc(v))){if(tip)tip.style.display='none';return}
    if(!tip){tip=document.createElement('div');tip.className='calctip';document.body.appendChild(tip)}
    const r=el.getBoundingClientRect();tip.textContent='= '+(Math.round(calc(v)*100)/100).toFixed(2);tip.style.display='block';tip.style.left=(r.left+8)+'px';tip.style.top=(r.bottom+4)+'px'};
  document.addEventListener('input',e=>{const el=e.target;if(el.matches&&el.matches('[data-calc]'))show(el)},true);
  document.addEventListener('focusin',e=>{const el=e.target;if(el.matches&&el.matches('[data-calc]'))show(el)},true);
  const done=el=>{if(tip)tip.style.display='none';if(isExpr(el.value)){const r=calc(el.value);if(!isNaN(r)){el.value=(Math.round(r*100)/100).toString();el.dispatchEvent(new Event('input',{bubbles:true}))}}};
  document.addEventListener('focusout',e=>{const el=e.target;if(el.matches&&el.matches('[data-calc]'))done(el)},true);
  document.addEventListener('keydown',e=>{const el=e.target;if(e.key==='Enter'&&el.matches&&el.matches('[data-calc]')&&isExpr(el.value)){const r=calc(el.value);if(!isNaN(r))el.value=(Math.round(r*100)/100).toString();if(tip)tip.style.display='none'}},true);
  window.addEventListener('scroll',()=>{if(tip)tip.style.display='none'},true);
})();

function needFor(w,fromToday){const n={},tk=todayKey();for(let i=0;i<7;i++){const k=dayKey(addDays(fromKey(w),i));if(fromToday&&k<tk)continue;dayPlan(k).forEach(it=>{if(eatenOf(it.ref))return;const r=recById(it.recId);((r&&r.items)||[]).forEach(x=>{n[x.ing]=(n[x.ing]||0)+x.qty})})}return n}
function groceryRows(wk){
  const cur=wkKey(new Date()),need=needFor(wk,wk===cur),stock={...((S.bodySettings||{}).stock||{})};
  if(wk>cur){const cn=needFor(cur,true);Object.keys(cn).forEach(i=>stock[i]=(+stock[i]||0)-cn[i])}
  const shop=(S.bodySettings||{}).shop,sv=shop&&shop.wk===wk?(shop.rows||{}):{};
  const ids=[...new Set([...Object.keys(need),...Object.keys(sv)])].filter(i=>ingById(i));
  return ids.map(i=>{const g=ingById(i),ps=+g.packSize||1,nd=need[i]||0,have=Math.max(0,+stock[i]||0),short=Math.max(0,nd-have),auto=Math.ceil(short/ps-1e-9),o=sv[i]||{};
    const packs=o.packs!=null?o.packs:auto,price=o.price!=null?+o.price:(+g.packPrice||0);return {i,g,ps,nd,have,short,auto,packs,price,got:!!o.got}}).sort((a,b)=>(a.got-b.got)||(b.packs>0)-(a.packs>0)||a.g.name.localeCompare(b.g.name));
}
const uq=(g,q)=>`${fmtQty(q)} ${esc(q===1?(g.unit||'pack'):(g.units||((g.unit||'pack')+'s')))}`;
function renderGroceries(){
  const cur=wkKey(new Date()),ws=addDays(weekStart(new Date()),7*shopWkOff),wk=dayKey(ws),we=addDays(ws,6),rows=groceryRows(wk);

function parseT(s){

function parsePlan(text){

    if(!a.ap&&s<last&&s+720<1440){s+=720;if(e!=null&&!(b&&b.ap)&&e<720)e+=720}

    let m=line.match(/^([0-9:.]+\s*(?:am|pm|a|p)?)\s*(?:-|\u2013|\u2014|to)\s*([0-9:.]+\s*(?:am|pm|a|p)?)\s+(.+)$/i);
    if(m){const a=parseT(m[1]),b=parseT(m[2]);if(a&&b){const [s,e]=fix(a,b);blocks.push({s,e,text:m[3].trim()});return}}
    m=line.match(/^([0-9:.]+\s*(?:am|pm|a|p)?)\s+(.+)$/i);
    if(m){const a=parseT(m[1]);if(a){const [s]=fix(a,null);blocks.push({s,e:null,text:m[2].trim()});return}}

  const {blocks,loose}=parsePlan(planText(k));
  const isToday=k===todayKey(),now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  let st=8*60,en=22*60;
  if(blocks.length){st=Math.min(st,Math.floor(blocks[0].s/60)*60);en=Math.max(en,Math.ceil(Math.max(...blocks.map(b=>b.e))/60)*60)}
  en=Math.min(en,24*60);
  const PX=40/60,H=(en-st)*PX;
  let hrs='';for(let t=st;t<=en;t+=60)hrs+=`<div class="hr" style="top:${10+(t-st)*PX}px"><span>${fmtM(t)}</span></div>`;
  /* lay overlapping blocks out side by side */
  let cl=[],clEnd=-1;const clusters=[];
  blocks.forEach(b=>{if(b.s>=clEnd&&cl.length){clusters.push(cl);cl=[]}cl.push(b);clEnd=Math.max(clEnd,b.e)});if(cl.length)clusters.push(cl);
  clusters.forEach(c=>{const ends=[];c.forEach(b=>{let i=ends.findIndex(x=>x<=b.s);if(i<0){i=ends.length;ends.push(0)}ends[i]=b.e;b.col=i});c.forEach(b=>b.cols=ends.length)});
  const bl=blocks.map(b=>{const top=10+(b.s-st)*PX,ht=Math.max(22,(b.e-b.s)*PX-3);const now=isToday&&b.s<=nowM&&nowM<b.e;
    const pos=b.cols>1?`left:calc(58px + (100% - 72px) * ${b.col}/${b.cols});right:auto;width:calc((100% - 72px) / ${b.cols} - 4px);`:'';
    return `<div class="blk ${now?'now':''}" style="top:${top}px;height:${ht}px;${pos}">${ht>=38?`<span class="bt">${fmtM(b.s)} – ${fmtM(b.e)}</span>`:''}${esc(b.text)}${ht<38?` <span class="bt" style="display:inline">${fmtM(b.s)}</span>`:''}</div>`}).join('');
  const nl=isToday&&nowM>=st&&nowM<=en?`<div class="nowline" style="top:${10+(nowM-st)*PX}px"></div>`:'';
  return `<div class="tl" style="height:${H+22}px">${hrs}${bl}${nl}</div>
    ${loose.length?`<div class="card" style="margin-top:14px"><h2>No time yet</h2>${loose.map(l=>`<div class="item"><span>${esc(l)}</span></div>`).join('')}</div>`:''}`;
}

/* food search: everything you've logged before, pick to add */
function foodHistory(){
  const hidden=new Set(((S.bodySettings||{}).hiddenFoods||[]).map(s=>s.toLowerCase()));
  const m=new Map();
  const add=(f,w)=>{const nm=(f.name||'').trim();if(!nm)return;const key=nm.toLowerCase();if(hidden.has(key))return;const t=f.createdAt||0;const e=m.get(key);
    if(!e)m.set(key,{name:nm,protein:+f.protein||0,kcal:+f.kcal||0,count:w,last:t});else{e.count+=w;if(t>=e.last){e.last=t;e.name=nm;e.protein=+f.protein||0;e.kcal=+f.kcal||0}}};
  S.meals.forEach(f=>add(f,0.5));S.food.forEach(f=>add(f,1));
  return [...m.values()].sort((a,b)=>(b.count-a.count)||(b.last-a.last));
}

/* habit momentum */
function habSeries(hb){
  const ks=new Set(hb.checks||[]),now=new Date(),t=hb.target||1;
  const first=Math.min(hb.createdAt||Date.now(),...[...ks].map(k=>fromKey(k).getTime()));
  const c0=new Date(first);const out=[];
  if(hb.period==='day'){for(let d=new Date(c0.getFullYear(),c0.getMonth(),c0.getDate());d<=now;d=addDays(d,1)){const k=dayKey(d);out.push({d:new Date(d),c:ks.has(k)?1:0,t:1})}}
  else if(hb.period==='week'){for(let d=weekStart(c0);d<=now;d=addDays(d,7))out.push({d,c:habCount(hb,d),t})}
  else{for(let d=new Date(c0.getFullYear(),c0.getMonth(),1);d<=now;d=new Date(d.getFullYear(),d.getMonth()+1,1))out.push({d,c:habCount(hb,d),t})}
  const A=hb.period==='day'?0.08:hb.period==='week'?0.3:0.45;
  let m=0;out.forEach((p,i)=>{const f=p.c>=p.t?1:0.4*(p.c/p.t),nm=m*(1-A)+A*f;m=(i===out.length-1)?Math.max(m,nm):nm;p.m=m;p.hit=p.c>=p.t});
  let cur=0;for(let i=out.length-1;i>=0;i--){if(out[i].hit)cur++;else if(i===out.length-1)continue;else break}
  let best=0,run=0;out.forEach(p=>{run=p.hit?run+1:0;best=Math.max(best,run)});
  return {pts:out,cur,best,total:ks.size,mom:Math.round(m*100)};
}
function habitDetail(hb){
  const S2=habSeries(hb),P=S2.pts,unit=hb.period==='day'?'day':hb.period==='week'?'week':'month';
  const N=hb.period==='day'?90:hb.period==='week'?26:12;
  const recent=P.slice(-N);
  const rN=hb.period==='day'?30:12,rr=P.slice(-rN),rate=rr.length?Math.round(rr.filter(p=>p.hit).length/rr.length*100):0;

  const line=xy.map(p=>p.map(v=>v.toFixed(2)).join(',')).join(' ');
  const area=n?`0,${H} ${line} ${W},${H}`:'';
  const first=recent[0],last=recent[recent.length-1];
  const lbl=p=>hb.period==='month'?MON[p.d.getMonth()]:fmtShort(dayKey(p.d));
  const chart=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:120px;display:block">
    <line x1="0" y1="${H/2}" x2="${W}" y2="${H/2}" stroke="#262626" stroke-width="1" vector-effect="non-scaling-stroke"/>
    ${n>1?`<polygon points="${area}" fill="rgba(237,237,237,.07)"/><polyline points="${line}" fill="none" stroke="#ededed" stroke-width="1.6" vector-effect="non-scaling-stroke"/>`:''}
  </svg><div class="row" style="justify-content:space-between;font:11px var(--mono);color:var(--tx4);margin-top:6px"><span>${first?lbl(first):''}</span><span>50%</span><span>${last?(hb.period==='day'?'Today':'Now'):''}</span></div>`;
  /* history */
  let hist='';
  if(hb.period==='day'){
    const ks=new Set(hb.checks||[]),tk=todayKey(),ws=weekStart(new Date()),startD=addDays(ws,-7*25),created=dayKey(P[0].d);
    hist='<div class="hd-grid">';for(let w=0;w<26;w++){hist+='<div class="wk">';for(let d=0;d<7;d++){const k=dayKey(addDays(startD,w*7+d));hist+=`<div class="c ${k>tk?'fut':ks.has(k)?'on':k<created?'pre':''}" title="${fmtDay(fromKey(k))}"></div>`}hist+='</div>'}hist+='</div>';
  }else{
    const bars=P.slice(-(hb.period==='week'?26:12)),mx=Math.max(hb.target,...bars.map(b=>b.c));
    hist=`<div class="hd-bars"><div class="tg" style="bottom:${hb.target/mx*100}%"></div>${bars.map(b=>`<div class="b ${b.hit?'hit':''}" style="height:${b.c/mx*100}%" title="${lbl(b)}: ${b.c}/${b.t}"></div>`).join('')}</div>
      <div class="row" style="justify-content:space-between;font:11px var(--mono);color:var(--tx4);margin-top:6px"><span>${bars[0]?lbl(bars[0]):''}</span><span>dashed line = target (${hb.target})</span><span>${hb.period==='week'?'This week':'This month'}</span></div>`;
  }
  const tk=todayKey(),doneToday=(hb.checks||[]).includes(tk);
  const momWord=S2.mom>=80?'Locked in':S2.mom>=55?'Building':S2.mom>=30?'Warming up':'Getting started';
  modal(`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="eyebrow">${hb.period==='day'?'Daily':hb.period==='week'?`Weekly · ${hb.target}× a week`:`Monthly · ${hb.target}× a month`}</div><div style="font:700 26px 'Chakra Petch',sans-serif;margin-top:4px">${esc(hb.name)}</div></div>
      <div class="row">${hb.archived?`<span class="muted" style="font-size:12px">Archived ${hb.archivedAt?fmtShort(dayKey(new Date(hb.archivedAt))):''}</span><button class="btn sm" data-a="unarch">Restore</button><button class="ghost danger-t" data-a="del">Delete forever</button>`:`<button class="btn sm ${doneToday?'pri':''}" data-a="tick">${doneToday?'✓ Done today':'Tick today'}</button><button class="ghost" data-a="edit">Edit</button>`}</div></div>
    <div class="hd-stats">
      <div class="hd-stat"><div class="eyebrow">Momentum</div><div class="n">${S2.mom}<small>% · ${momWord}</small></div></div>
      <div class="hd-stat"><div class="eyebrow">Streak</div><div class="n">${S2.cur}<small>${unit}${S2.cur===1?'':'s'}</small></div></div>
      <div class="hd-stat"><div class="eyebrow">Best streak</div><div class="n">${S2.best}<small>${unit}${S2.best===1?'':'s'}</small></div></div>
      <div class="hd-stat"><div class="eyebrow">${hb.period==='day'?'Last 30 days':'Last 12 '+unit+'s'}</div><div class="n">${rate}<small>%</small></div></div>
    </div>
    <div class="hd-chart"><div class="eyebrow" style="margin-bottom:8px">Momentum</div>${chart}</div>
    <div class="hd-chart"><div class="eyebrow" style="margin-bottom:10px">${hb.period==='day'?'Last 26 weeks':hb.period==='week'?'Last 26 weeks':'Last 12 months'}</div>${hist}</div>
    <div class="muted" style="font-size:12px;line-height:1.6">Momentum rises each ${unit} you hit and fades slowly when you miss. A missed ${unit} dents it, it doesn't reset it. ${hb.period!=='day'?`A ${unit} counts as hit once you reach ${hb.target}.`:''} Total check-ins: ${S2.total}.</div>`,
  (d,close)=>{
    if(hb.archived){d.querySelector('[data-a=unarch]').onclick=()=>{close();store.patch('habits',hb.id,{archived:false,archivedAt:null});toast(`Restored \u201c${hb.name}\u201d`)};

}

function route(){let h=location.hash.slice(1);if(h==='plan'||h==='week')h='focus';if(h==='log')h='progress';view=VIEWS[h]?h:'focus';editingTask=editingDue=editingFolder=null;render()}

/* ---------- GitHub mode: data in a private repo, cached on this device, works offline ---------- */
let ghMode=false;
const GH={owner:'eikx3-elle',repo:'lockin-data',token:null,files:{},lastSync:0};
const GHFILE={study:'lockin-work.json',body:'lockin-fitness.json',money:'lockin-money.json'};
const GHK='lockin-gh-';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function b64e(str){const by=new TextEncoder().encode(str);let s='';for(let i=0;i<by.length;i+=0x8000)s+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(s)}
function b64d(b){const s=atob(String(b).replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0)))}
async function ghReq(path,opt={}){
  return fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`,{...opt,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+GH.token,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
}
function ghPersist(F){const st=GH.files[F.name];lsSet(GHK+'file-'+F.name,JSON.stringify({text:st.text,sha:st.sha,etag:st.etag}))}
function ghSaveOps(F){lsSet(GHK+'ops-'+F.name,JSON.stringify(F.ops))}
function ghLoadOps(F){try{return JSON.parse(lsGet(GHK+'ops-'+F.name)||'[]')}catch(e){return []}}
async function ghFetch(F,force){
  const st=GH.files[F.name];
  const r=await ghReq('/contents/'+GHFILE[F.name],{headers:!force&&st.etag?{'If-None-Match':st.etag}:{}});
  if(r.status===304)return false;
  if(r.status===401||r.status===403){const e=new Error('auth');e.auth=true;throw e}
  if(r.status===404){st.exists=false;return false}
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();let text=j.content?b64d(j.content):'';
  if(!j.content&&j.size>0){const rb=await ghReq('/git/blobs/'+j.sha);if(!rb.ok)throw new Error('blob '+rb.status);text=b64d((await rb.json()).content)}
  st.etag=r.headers.get('ETag');st.exists=true;
  const changed=j.sha!==st.sha;
  if(changed){st.sha=j.sha;st.text=text;st.mtime++}
  ghPersist(F);GH.lastSync=Date.now();return changed;
}
async function ghWrite(F,text){
  const st=GH.files[F.name],body={message:`Update ${FKEY[F.name]} (${new Date().toLocaleString()})`,content:b64e(text)};
  if(st.sha)body.sha=st.sha;
  const r=await ghReq('/contents/'+GHFILE[F.name],{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422){st.etag=null;await ghFetch(F,true);const e=new Error('conflict');e.retry=true;throw e}
  if(r.status===401||r.status===403){const e=new Error('auth');e.auth=true;throw e}
  if(!r.ok)throw new Error('save '+r.status);
  const j=await r.json();st.sha=j.content.sha;st.text=text;st.etag=null;st.exists=true;ghPersist(F);
}
function ghHandle(F){return {name:'GitHub sync',kind:'file',isServer:true,
  async getFile(){return new File([GH.files[F.name].text||''],GHFILE[F.name],{lastModified:GH.files[F.name].mtime})},
  async createWritable(){let buf='';return {async write(s){buf+=s},async close(){await ghWrite(F,buf)}}},
  async queryPermission(){return 'granted'},async requestPermission(){return 'granted'}}}
const GHF=()=>[FILES.study,FILES.body,FILES.money];
async function ghPoll(){
  if(!ghMode||document.hidden||!navigator.onLine)return;
  for(const F of GHF()){if(F.saving||F.dirty)continue;try{if(await ghFetch(F))checkFile(F)}catch(e){if(e.auth){ghAuthProblem();return}}}
}
let ghAuthShown=false;
function ghAuthProblem(){if(ghAuthShown)return;ghAuthShown=true;toast('Your GitHub key stopped working. Click the sync status (bottom left) to update it.')}
function ghGate(msg){
  const g=$('#gate');g.style.display='flex';
  g.innerHTML=`<div class="gate-in" style="max-width:500px"><div class="brand" style="padding:0"><i></i>Lock in</div><h1>Connect your data</h1>
    <p>Your data lives in your private GitHub repo <span class="mono" style="font-size:12.5px">${GH.owner}/${GH.repo}</span>. Paste your key once on this device and it stays connected.</p>
    ${msg?`<div class="err">${esc(msg)}</div>`:''}
    <input id="gh-tok" type="password" placeholder="github_pat_…" autocomplete="off" style="font-family:var(--mono)">
    <div class="row"><button class="btn pri lg" id="gh-go">Connect</button></div>
    <p class="small">Need a key? <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="color:var(--tx2)">Create a fine-grained token</a> with access to only <b>${GH.repo}</b> and <b>Contents: Read and write</b>. It's stored only on this device.</p></div>`;
  const go=async()=>{const t=$('#gh-tok').value.trim();if(!t)return;$('#gh-go').textContent='Checking…';GH.token=t;
    try{const r=await ghReq('');if(r.status===200){lsSet(GHK+'token',t);hideGate();ghAuthShown=false;await ghStart();return}
      ghGate(r.status===401?'That key didn\u2019t work. Check you copied all of it.':r.status===404||r.status===403?`That key can\u2019t see ${GH.repo}. Give it access to that repository.`:'GitHub said '+r.status+'. Try again.')}
    catch(e){ghGate('Couldn\u2019t reach GitHub. Check your internet connection.')}};
  $('#gh-go').onclick=go;$('#gh-tok').addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>{const i=$('#gh-tok');i&&i.focus()},20);
}
async function ghStart(){
  for(const F of GHF()){let c={};try{c=JSON.parse(lsGet(GHK+'file-'+F.name)||'{}')}catch(e){}GH.files[F.name]={text:c.text||'',sha:c.sha||null,etag:c.etag||null,mtime:1}}
  let reached=false;
  if(navigator.onLine){
    try{await Promise.race([Promise.all(GHF().map(F=>ghFetch(F,true))),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),9000))]);reached=true}
    catch(e){if(e.auth){ghGate('Your saved key no longer works. Paste a new one.');return}}
  }
  if(!reached&&!GHF().some(F=>GH.files[F.name].text)){
    $('#main').innerHTML='<div class="wrap"><div class="card" style="max-width:520px;margin-top:40px;padding:28px"><div style="font:700 20px \'Chakra Petch\',sans-serif;margin-bottom:8px">You\u2019re offline</div><p class="muted">Open Lock In once while online on this device, and after that it works offline too.</p></div></div>';
    window.addEventListener('online',()=>location.reload(),{once:true});return;
  }
  for(const F of GHF()){
    await openHandle(F,ghHandle(F));
    const saved=ghLoadOps(F);
    if(saved.length){F.ops=saved;saved.forEach(o=>applyOp(S,o));scheduleSave(F)}
  }
  render();
  if(!reached)GHF().forEach(F=>setSave(F,'Offline · saved on this device'));
}
async function tryGitHub(){
  if(!/github\.io$/.test(location.hostname)&&!/[?&]gh\b/.test(location.search))return false;
  ghMode=true;serverMode=true;
  GH.token=lsGet(GHK+'token');
  if(!GH.token){ghGate();return true}
  await ghStart();return true;
}
setInterval(ghPoll,15000);
window.addEventListener('focus',()=>ghPoll());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)ghPoll();else if(ghMode)GHF().forEach(F=>{if(F.dirty)flush(F)})});
window.addEventListener('online',()=>{if(!ghMode)return;GHF().forEach(F=>{if(F.dirty||F.ops.length)scheduleSave(F)});ghPoll()});
window.addEventListener('offline',()=>{if(ghMode)GHF().forEach(F=>setSave(F,'Offline · saved on this device'))});
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{const up=()=>reg.update().catch(()=>{});window.addEventListener('focus',up);document.addEventListener('visibilitychange',()=>{if(!document.hidden)up()});setInterval(up,30*60e3)}).catch(()=>{});
  /* a new version took over: reload once, when it won't interrupt typing */
  let swReloaded=false;const tryReload=()=>{if(swReloaded)return;const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea')){setTimeout(tryReload,4000);return}if(GHF().some(F=>F.saving)){setTimeout(tryReload,1500);return}swReloaded=true;location.reload()};
  if(navigator.serviceWorker.controller)navigator.serviceWorker.addEventListener('controllerchange',tryReload);
}

/* ---------- cloud mode: data in the artifact's database, synced across devices ---------- */
let cloudMode=false,resolveCloud=null;
const CLOUD={db:null,docs:new Map(),mtime:{study:1,body:1,money:1},ready:false};
const FKEY={study:'work',body:'fitness',money:'money'};
const BUCKETED=['sessions','plans','food','workouts','weights','expenses','events'];
function stableStr(v){if(Array.isArray(v))return '['+v.map(stableStr).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stableStr(v[k])).join(',')+'}';return JSON.stringify(v===undefined?null:v)}
const bucketOf=(col,it)=>{const d=String(it.day||it.date||'');return BUCKETED.includes(col)&&/^\d{4}-\d{2}/.test(d)?d.slice(0,7):'all'};
function cloudAssemble(F){
  const pre=FKEY[F.name]+'.',ids=[...CLOUD.docs.keys()].filter(id=>id.startsWith(pre)).sort();
  if(!ids.length)return null;
  const o={app:'lock-in',kind:F.name,version:1,settings:{}};F.cols.forEach(c=>o[c]=[]);
  ids.forEach(id=>{const d=JSON.parse(CLOUD.docs.get(id));if(id===pre+'settings')o.settings=d.settings||{};else{const c=id.slice(pre.length).split('.')[0];if(o[c])o[c]=o[c].concat(d.items||[])}});
  return o;
}
async function cloudWrite(F,obj){
  const pre=FKEY[F.name],want=new Map(),col=CLOUD.db.collection('b');
  want.set(pre+'.settings',{settings:obj.settings||{}});
  F.cols.forEach(c=>{const g={};(obj[c]||[]).forEach(it=>{const k=bucketOf(c,it);(g[k]=g[k]||[]).push(it)});Object.entries(g).forEach(([k,items])=>want.set(`${pre}.${c}.${k}`,{items}))});
  for(const [id,body] of want){const s=stableStr(body);if(CLOUD.docs.get(id)!==s){CLOUD.docs.set(id,s);await col.doc(id).set(JSON.parse(s))}}
  for(const id of [...CLOUD.docs.keys()]){if(id.startsWith(pre+'.')&&!want.has(id)){CLOUD.docs.delete(id);await col.doc(id).delete()}}
}
function cloudHandle(F){return {name:'Cloud sync',kind:'file',isServer:true,
  async getFile(){const o=cloudAssemble(F);return new File([o?JSON.stringify(o):''],FKEY[F.name]+'.json',{lastModified:CLOUD.mtime[F.name]})},
  async createWritable(){let buf='';return {async write(s){buf+=s},async close(){await cloudWrite(F,JSON.parse(buf))}}},
  async queryPermission(){return 'granted'},async requestPermission(){return 'granted'}}}
function cloudFail(){$('#main').innerHTML='<div class="wrap"><div class="card" style="max-width:520px;margin-top:40px;padding:28px"><div style="font:700 20px \'Chakra Petch\',sans-serif;margin-bottom:8px">Can\u2019t reach your data</div><p class="muted">Make sure you\u2019re signed in to Claude and online, then refresh this page.</p></div></div>'}
async function tryCloud(){
  const hosted=location.protocol==='https:'&&!/github\.io$/.test(location.hostname);
  let c=window.claude;for(let i=0;!c&&i<(hosted?60:10);i++){await new Promise(r=>setTimeout(r,hosted?200:100));c=window.claude}
  if(!c||!c.use){if(hosted){cloudFail();return true}return false}
  let db=null;try{db=await c.use('db')}catch(e){db=null}
  if(!db){if(hosted){cloudFail();return true}return false}
  CLOUD.db=db;cloudMode=true;serverMode=true;
  const slow=setTimeout(()=>{if(!CLOUD.ready)toast('Still connecting to your data\u2026')},10000);
  await new Promise(res=>{resolveCloud=res;
    db.collection('b').onSnapshot(snap=>{
      const seen=new Set(),changed=new Set();
      snap.docs.forEach(d=>{seen.add(d.id);const s=stableStr(d.data());if(CLOUD.docs.get(d.id)!==s){CLOUD.docs.set(d.id,s);changed.add(d.id.split('.')[0])}});
      for(const id of [...CLOUD.docs.keys()])if(!seen.has(id)){CLOUD.docs.delete(id);changed.add(id.split('.')[0])}
      changed.forEach(p=>{const fn=Object.keys(FKEY).find(k=>FKEY[k]===p);if(fn)CLOUD.mtime[fn]++});
      if(!snap.metadata.fromCache&&!CLOUD.ready){CLOUD.ready=true;clearTimeout(slow);resolveCloud()}
      else if(CLOUD.ready)checkAll();
    },err=>{clearTimeout(slow);toast('Sync problem ('+err.code+'). Refresh to try again.');if(!CLOUD.ready){CLOUD.ready=true;resolveCloud()}});
  });
  for(const F of [FILES.study,FILES.body,FILES.money]){try{await openHandle(F,cloudHandle(F))}catch(e){console.error(e)}}
  return true;
}
/* ---------- launcher (local helper) mode: no permission prompts ---------- */
let serverMode=false;
function httpHandle(name){return {name,kind:'file',isServer:true,
  async getFile(){const r=await fetch('/data/'+name,{cache:'no-store'});if(!r.ok)throw new Error('read failed');const t=await r.text();return new File([t],name,{lastModified:+(r.headers.get('X-Mtime')||0)})},
  async createWritable(){let buf='';return {async write(s){buf+=s},async close(){const r=await fetch('/data/'+name,{method:'PUT',headers:{'Content-Type':'application/json'},body:buf});if(!r.ok)throw new Error('save failed')}}},
  async queryPermission(){return 'granted'},async requestPermission(){return 'granted'}}}
async function tryServer(){
  if(!/^https?:$/.test(location.protocol))return false;
  try{const r=await fetch('/api/ping',{cache:'no-store'});if(!r.ok||(await r.text()).trim()!=='lockin')return false}catch(e){return false}
  serverMode=true;
  await openHandle(FILES.study,httpHandle('lockin-work.json'));
  await openHandle(FILES.body,httpHandle('lockin-fitness.json'));
  try{await openHandle(FILES.money,httpHandle('lockin-money.json'))}catch(e){console.error(e)}
  return true;
}
/* ---------- init ---------- */
async function init(){
  route();
  if(await tryGitHub())return;
  if(await tryCloud())return;
  if(await tryServer())return;
  if(!hasFS){mode='local';loadLocal();if(!S.folders.length&&!S.sessions.length&&!S.tasks.length)seed(FILES.study);if(!S.bodySettings.targets)S.bodySettings={targets:{protein:120,kcal:2000}};saveLocal();render();
    toast('This browser can\u2019t save to a file. Open the app in Opera, Chrome or Edge.');return}
  const hm=await kvGet('moneyfile');if(hm&&hm.queryPermission)FILES.money.pending=hm;
  const hb=await kvGet('bodyfile');
  if(hb&&hb.queryPermission)FILES.body.pending=hb;
  const h=await kvGet('file');
  if(h&&h.queryPermission){
    try{const p=await h.queryPermission({mode:'readwrite'});if(p==='granted'&&await openHandle(FILES.study,h)){
      if(hb){try{if(await hb.queryPermission({mode:'readwrite'})==='granted')await openHandle(FILES.body,hb)}catch(e){}}
      if(hm){try{if(await hm.queryPermission({mode:'readwrite'})==='granted')await openHandle(FILES.money,hm)}catch(e){}}
      return}}catch(e){}
    showGate('reconnect',h);return;
  }
  showGate('new');
}
init();
